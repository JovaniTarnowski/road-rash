# Host Nginx TLS entrypoint; public-IP binding preserves Tailscale's port 443.
# The internal HTTP hop uses Dokku's generated virtual host so app redeploys
# update the backend without rewriting this file.
server {
    listen 5.161.142.20:443 ssl;
    server_name road-rash.archit.xyz;
    ssl_certificate /etc/letsencrypt/live/road-rash.archit.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/road-rash.archit.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/road-rash-net.conf;
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host road-rash.archit.xyz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
