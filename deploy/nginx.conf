server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    sendfile on;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://o425745.ingest.us.sentry.io https://nazar.archit.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /game-assets/manifest.json {
        alias /srv/game-assets/manifest.json;
        add_header Cache-Control "no-cache";
    }
    # Stable social preview image. Crawlers fetch it on every share, so a
    # short public cache beats the no-store default without risking stale
    # previews for long after a redeploy.
    location = /og-image.png {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/game-assets/([a-f0-9]{64})$" {
        alias /srv/game-assets/$1;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /game-assets/ { return 404; }
    # Every immutable engine/glue/app URL contains its content hash. Reusing
    # rr-game.js with a new rr-game.wasm can fail before main() even starts.
    location ~ "^/(rr-game|app|style|references|telemetry)\.[a-f0-9]{16}\.(js|wasm|css|json)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://o425745.ingest.us.sentry.io https://nazar.archit.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
