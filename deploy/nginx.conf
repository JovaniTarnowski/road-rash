# Sentry tunnel (/t/e): blockers drop direct sentry.io traffic. The limit is
# one global bucket (10/s, bursts of 100) that protects the Sentry quota from
# floods: behind the host TLS proxy and Dokku's proxy, which rewrites
# X-Forwarded-For, every request reaches this container from the same address.
map $server_port $error_tunnel_key { default tunnel; }
limit_req_zone $error_tunnel_key zone=errtunnel:1m rate=10r/s;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    sendfile on;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://nazar.archit.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Same-origin Sentry tunnel (SDK `tunnel: '/t/e'`). The upstream is fixed
    # to this project's envelope endpoint, so it cannot relay to any other
    # host or project. Client IPs, cookies and auth headers are not forwarded.
    # A variable upstream resolves at request time: a DNS failure at boot
    # cannot stop the site from starting.
    location = /t/e {
        limit_except POST { deny all; }
        limit_req zone=errtunnel burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $error_ingest o425745.ingest.us.sentry.io;
        proxy_pass https://$error_ingest/api/4512320659914752/envelope/;
        proxy_http_version 1.1;
        proxy_set_header Host $error_ingest;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_ssl_server_name on;
        proxy_ssl_name $error_ingest;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Set-Cookie;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /game-assets/manifest.json {
        alias /srv/game-assets/manifest.json;
        add_header Cache-Control "no-cache";
    }
    # Stable social preview image. Crawlers fetch it on every share, so a
    # short public cache beats the no-store default without risking stale
    # previews for long after a redeploy.
    location = /og-image.png {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/game-assets/([a-f0-9]{64})$" {
        alias /srv/game-assets/$1;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /game-assets/ { return 404; }
    # Every immutable engine/glue/app URL contains its content hash. Reusing
    # rr-game.js with a new rr-game.wasm can fail before main() even starts.
    location ~ "^/(rr-game|app|style|references|telemetry)\.[a-f0-9]{16}\.(js|wasm|css|json)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://nazar.archit.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
